# Secrets: generated on the first run into secrets/<host>/ on the control machine (git-ignored, mode 600)
# and reused afterwards, so re-runs never rotate them. To move an Obcell to new hardware, copy that folder.
# To encrypt it at rest: ansible-vault encrypt secrets/<host>/* (lookups decrypt transparently).
obcell_secrets_dir: "{{ playbook_dir }}/secrets/{{ inventory_hostname }}"

strom_admin_password_hash: "{{ lookup('ansible.builtin.file', obcell_secrets_dir ~ '/strom_admin_password_hash') }}"
couchdb_user: admin
couchdb_password: "{{ lookup('ansible.builtin.password', obcell_secrets_dir ~ '/couchdb_password', chars=['ascii_letters', 'digits'], length=32) }}"
strom_api_key: "{{ lookup('ansible.builtin.password', obcell_secrets_dir ~ '/strom_api_key', chars=['hexdigits'], length=48) }}"
strom_admin_password: "{{ lookup('ansible.builtin.password', obcell_secrets_dir ~ '/strom_admin_password', chars=['ascii_letters', 'digits'], length=20) }}"
authelia_session_secret: "{{ lookup('ansible.builtin.password', obcell_secrets_dir ~ '/authelia_session_secret', chars=['ascii_letters', 'digits'], length=64) }}"
authelia_storage_encryption_key: "{{ lookup('ansible.builtin.password', obcell_secrets_dir ~ '/authelia_storage_encryption_key', chars=['ascii_letters', 'digits'], length=64) }}"
authelia_reset_jwt_secret: "{{ lookup('ansible.builtin.password', obcell_secrets_dir ~ '/authelia_reset_jwt_secret', chars=['ascii_letters', 'digits'], length=64) }}"
# Must stay short: the SFU image's nginx map_hash_bucket_size (64) overflows with long keys.
smb_apikey: "{{ lookup('ansible.builtin.password', obcell_secrets_dir ~ '/smb_apikey', chars=['ascii_letters', 'digits'], length=24) }}"
whip_auth_key: "{{ lookup('ansible.builtin.password', obcell_secrets_dir ~ '/whip_auth_key', chars=['ascii_letters', 'digits'], length=32) }}"
openwebrx_admin_password: "{{ lookup('ansible.builtin.password', obcell_secrets_dir ~ '/openwebrx_admin_password', chars=['ascii_letters', 'digits'], length=20) }}"
srt_passphrase: "{{ lookup('ansible.builtin.password', obcell_secrets_dir ~ '/srt_passphrase', chars=['hexdigits'], length=32) }}"
