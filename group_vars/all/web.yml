# derived: names and origins for the web front door (Caddy + Authelia). Order matters only for readability.
obcell_names: "{{ [obcell_mdns_name] + ([obcell_tailnet_name] if obcell_tailnet_name else []) }}"                 # hostnames
obcell_names_ip: "{{ [obcell_mdns_name, obcell_lan_ip] + ([obcell_tailnet_name] if obcell_tailnet_name else []) }}"  # hostnames + LAN IP
# Homepage portal: port-less names and :5443 on every name/IP.
obcell_portal_hosts: >-
  {{ [obcell_mdns_name, obcell_mdns_name ~ ':5443', obcell_lan_ip ~ ':5443']
     + ([obcell_tailnet_name ~ ':5443', obcell_tailnet_name] if obcell_tailnet_name else []) }}
obcell_portal_origins: "{{ obcell_portal_hosts | obcell_urls }}"

# Container CPU fence, as a compose line (or a comment when pinning is off).
container_cpuset_line: >-
  {{ ('cpuset: "' ~ (container_cpus | join(',')) ~ '"') if cpu_pinning | bool else '# cpuset: not pinned (cpu_pinning: false)' }}
gnb_cpu_range: "{{ gnb_cpus | obcell_cpu_range if cpu_pinning | bool else 'any' }}"
container_cpu_range: "{{ container_cpus | obcell_cpu_range if cpu_pinning | bool else 'any' }}"

# OwnTracks: where the apps post (in the setup QR code). Through Funnel it works from anywhere with
# internet; otherwise on the tailnet name (phones with Tailscale) or the LAN IP (phones that trust
# Caddy's CA). Override owntracks_app_server to pick another address.
owntracks_app_server: >-
  {{ ('https://' ~ obcell_tailnet_name ~ ':' ~ owntracks_funnel_port) if owntracks_funnel | bool
     else ('https://' ~ (obcell_tailnet_name or obcell_lan_ip) ~ ':' ~ owntracks_https_port) }}
owntracks_app_url: "{{ owntracks_app_server }}/pub/{{ owntracks_pub_token }}"
# The app's minimal setup: HTTP mode and the URL. Username, device and tracker ID stay unset, so one
# code fits every phone; people set them in the app.
owntracks_app_config: {_type: configuration, mode: 3, url: "{{ owntracks_app_url }}", auth: false}
owntracks_app_config_uri: "owntracks:///config?inline={{ owntracks_app_config | to_json(separators=(',', ':')) | b64encode | urlencode }}"
owntracks_join_urls: "{{ (obcell_names_ip | obcell_urls(owntracks_https_port) | map('regex_replace', '$', '/join/') | list) + ['http://' ~ obcell_lan_ip ~ '/join/'] }}"
