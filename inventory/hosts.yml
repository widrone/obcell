# Obcell hosts. install.sh adds the box it runs on as inventory/<name>.yml, and its settings as
# inventory/host_vars/<name>/main.yml (both git-ignored, so your box details stay out of git).
# Ansible reads every file in this folder. To manage a box over SSH, add it here or in its own
# file: ansible_host: <ip>, ansible_user: <user>. See host_vars/example/main.yml.
all:
  children:
    obcell:
      hosts: {}
