# ---------------------------------------------------------------- MongoDB (subscriber database)
- name: MongoDB series
  ansible.builtin.include_tasks: mongodb_series.yml

- name: MongoDB upgrade pending
  ansible.builtin.debug:
    msg: >-
      MongoDB {{ mongodb_series }} is installed and the playbook wants {{ mongodb_version }}.
      Keeping {{ mongodb_series }}; run upgrade.yml to move the data (docs/upgrades.md).
  when: mongodb_series != mongodb_version

- name: MongoDB repository
  ansible.builtin.include_tasks: mongodb_repo.yml

- name: Open5GS PPA
  ansible.builtin.include_tasks: ../../common/tasks/ppa.yml
  vars:
    ppa: "{{ open5gs_ppa }}"

- name: MongoDB + Open5GS packages
  ansible.builtin.apt:
    name: [mongodb-org, open5gs]
    update_cache: "{{ mongo_repo is changed or ppa_added is changed }}"
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: MongoDB running
  ansible.builtin.systemd:
    name: mongod
    enabled: true
    state: started

# ---------------------------------------------------------------- core configuration
- name: Open5GS configuration (PLMN, TAC, UE pool)
  ansible.builtin.template:
    src: "{{ item }}.yaml.j2"
    dest: "/etc/open5gs/{{ item }}.yaml"
    mode: "0644"
  loop: [amf, mme, nrf, smf, upf]
  notify: Restart Open5GS core

# ---------------------------------------------------------------- WebUI (subscribers / SIMs)
- name: WebUI
  when: open5gs_webui_enabled | bool
  block:
    - name: NodeSource key
      ansible.builtin.include_tasks: ../../common/tasks/apt_keyring.yml
      vars:
        key_url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        keyring: /usr/share/keyrings/nodesource.gpg

    - name: NodeSource repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/nodesource.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: https://deb.nodesource.com/node_{{ nodejs_major }}.x
          Suites: nodistro
          Components: main
          Architectures: {{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}
          Signed-By: /usr/share/keyrings/nodesource.gpg
      register: node_repo

    # Ubuntu's own nodejs can be newer than NodeSource's (26.04 ships 22.x) and then wins,
    # but it comes without npm, which the WebUI build needs. Prefer NodeSource, as its docs say.
    - name: Prefer NodeSource's nodejs over Ubuntu's
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/nodesource
        mode: "0644"
        content: |
          Package: nodejs
          Pin: origin deb.nodesource.com
          Pin-Priority: 600

    - name: Node.js installed before this run
      ansible.builtin.command:
        argv: [dpkg-query, -W, "-f=${db:Status-Status} ${Version}", nodejs]
      register: node_before
      changed_when: false
      failed_when: false
      check_mode: false

    # A version pattern, so a box on another major moves to nodejs_major (up or down).
    - name: Node.js {{ nodejs_major }}
      ansible.builtin.apt:
        name: "nodejs={{ nodejs_major }}.*"
        allow_downgrade: true
        update_cache: "{{ node_repo is changed }}"
      when: not (ansible_check_mode and node_repo is changed)

    # Check mode doesn't fetch the new repository, so apt can't see its packages yet.
    - name: Node.js {{ nodejs_major }} would come from the new repository (check mode)
      ansible.builtin.debug:
        msg: "nodejs {{ node_before.stdout | default('not installed', true) }} -> {{ nodejs_major }}.x"
      changed_when: true
      when: ansible_check_mode and node_repo is changed

    - name: WebUI installed?
      ansible.builtin.stat:
        path: /usr/lib/node_modules/open5gs/server/index.js
      register: webui

    # What the installed WebUI was built from. Builds older than the stamp count as built
    # with open5gs_version and the Node.js that was installed before this run.
    - name: WebUI build stamp
      ansible.builtin.command: cat /usr/lib/node_modules/open5gs/.obcell-build
      register: webui_stamp
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Is the WebUI build current?
      ansible.builtin.set_fact:
        webui_build_wanted: "open5gs {{ open5gs_version }} node {{ nodejs_major }}"
        webui_build_have: >-
          {{ webui_stamp.stdout if webui_stamp.rc == 0 else
             'open5gs ' ~ open5gs_version ~ ' node '
             ~ (node_before.stdout | regex_search('^installed ([0-9]+)\.', '\1') | default(['none'], true) | first) }}

    - name: WebUI would be rebuilt (check mode)
      ansible.builtin.debug:
        msg: "WebUI: {{ webui_build_have if webui.stat.exists else 'not installed' }} -> {{ webui_build_wanted }}"
      changed_when: true
      when: ansible_check_mode and (not webui.stat.exists or webui_build_have != webui_build_wanted)

    # Same steps as https://open5gs.org/open5gs/assets/webui/install, pinned to open5gs_version.
    - name: Build the WebUI
      when: (not webui.stat.exists or webui_build_have != webui_build_wanted) and not ansible_check_mode
      block:
        - name: WebUI build directory
          ansible.builtin.tempfile:
            state: directory
            suffix: webui
          register: webui_tmp

        - name: Open5GS source
          ansible.builtin.unarchive:
            src: "https://github.com/open5gs/open5gs/archive/v{{ open5gs_version }}.tar.gz"
            dest: "{{ webui_tmp.path }}"
            remote_src: true

        - name: npm clean-install && npm run build
          ansible.builtin.shell: npm clean-install && npm run build
          args:
            chdir: "{{ webui_tmp.path }}/open5gs-{{ open5gs_version }}/webui"

        # A rebuild replaces the old tree but keeps its .env (the WebUI's session and JWT
        # secrets), so nobody is logged out.
        - name: Install to /usr/lib/node_modules/open5gs
          ansible.builtin.shell: |
            set -e
            new={{ webui_tmp.path }}/open5gs-{{ open5gs_version }}/webui
            dst=/usr/lib/node_modules/open5gs
            mkdir -p /usr/lib/node_modules
            if [ -f "$dst/.env" ]; then cp -p "$dst/.env" "$new/.env"; fi
            rm -rf "$dst.old"
            if [ -d "$dst" ]; then mv "$dst" "$dst.old"; fi
            mv "$new" "$dst"
            chown -R open5gs:open5gs "$dst"
            rm -rf "$dst.old"
          notify: Restart open5gs-webui

        - name: Default WebUI admin account (admin / 1423) if none exists
          ansible.builtin.command: mongosh --quiet open5gs {{ webui_tmp.path }}/open5gs-{{ open5gs_version }}/docs/assets/webui/mongo-init.js
          environment:
            HOME: /root
      always:
        - name: Remove build directory
          ansible.builtin.file:
            path: "{{ webui_tmp.path }}"
            state: absent
          when: webui_tmp.path is defined

    - name: WebUI build stamp written
      ansible.builtin.copy:
        dest: /usr/lib/node_modules/open5gs/.obcell-build
        content: "{{ webui_build_wanted }}\n"
        owner: open5gs
        group: open5gs
        mode: "0644"
      when: not ansible_check_mode or webui.stat.exists

    - name: WebUI service
      ansible.builtin.template:
        src: open5gs-webui.service.j2
        dest: /lib/systemd/system/open5gs-webui.service
        mode: "0644"
      notify: Restart open5gs-webui

    - name: WebUI drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/open5gs-webui.service.d
        state: directory
        mode: "0755"

    - name: WebUI listen address/port
      tags: [frontdoor]
      ansible.builtin.template:
        src: webui-listen.conf.j2
        dest: /etc/systemd/system/open5gs-webui.service.d/listen.conf
        mode: "0644"
      notify: Restart open5gs-webui

    - name: WebUI enabled
      ansible.builtin.systemd:
        name: open5gs-webui
        enabled: true
        state: started
        daemon_reload: true

# ---------------------------------------------------------------- SIMs
- name: Load subscribers from secrets/<host>/subscribers.yml
  ansible.builtin.include_vars:
    file: "{{ obcell_secrets_dir }}/subscribers.yml"
  when: lookup('ansible.builtin.fileglob', obcell_secrets_dir ~ '/subscribers.yml') | length > 0
  no_log: true

- name: Provision subscribers (insert only; the WebUI owns them afterwards)
  ansible.builtin.command:
    argv:
      - mongosh
      - --quiet
      - open5gs
      - --eval
      - "{{ lookup('ansible.builtin.template', 'add_subscriber.js.j2') }}"
  environment:
    HOME: /root
  loop: "{{ open5gs_subscribers }}"
  loop_control:
    label: "{{ item.imsi }}"
  register: sub_add
  changed_when: "'inserted' in sub_add.stdout"
  no_log: true
  when: not ansible_check_mode
