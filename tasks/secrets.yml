# Runs on the control machine: make sure secrets/<host>/ exists and every password has its hash.
- name: Secrets folder
  ansible.builtin.file:
    path: "{{ obcell_secrets_dir }}"
    state: directory
    mode: "0700"

- name: Hash helper
  ansible.builtin.set_fact:
    _hash_py: >-
      import sys; from passlib.hash import argon2, bcrypt; pw = sys.stdin.read().strip();
      print(argon2.using(type="ID", memory_cost=65536, time_cost=3, parallelism=4).hash(pw) if sys.argv[1] == "argon2"
      else bcrypt.using(rounds=int(sys.argv[2]) if len(sys.argv) > 2 else 14, ident="2a").hash(pw))

- name: Authelia password hashes (argon2id)
  ansible.builtin.shell:
    cmd: >-
      {{ ansible_playbook_python }} -c '{{ _hash_py }}' argon2 < '{{ obcell_secrets_dir }}/authelia_{{ item.name }}_password'
      > '{{ obcell_secrets_dir }}/authelia_{{ item.name }}.hash' && chmod 600 '{{ obcell_secrets_dir }}/authelia_{{ item.name }}.hash'
    creates: "{{ obcell_secrets_dir }}/authelia_{{ item.name }}.hash"
  loop: "{{ authelia_users }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    _pw: "{{ lookup('ansible.builtin.password', obcell_secrets_dir ~ '/authelia_' ~ item.name ~ '_password', chars=['ascii_letters', 'digits'], length=20) }}"
  # touching _pw first creates the password file
  register: _h
  when: _pw | length > 0

- name: Strom admin password hash (bcrypt)
  ansible.builtin.shell:
    cmd: >-
      {{ ansible_playbook_python }} -c '{{ _hash_py }}' bcrypt < '{{ obcell_secrets_dir }}/strom_admin_password'
      > '{{ obcell_secrets_dir }}/strom_admin_password_hash' && chmod 600 '{{ obcell_secrets_dir }}/strom_admin_password_hash'
    creates: "{{ obcell_secrets_dir }}/strom_admin_password_hash"
  when: strom_admin_password | length > 0

# The Recorder lower-cases user names, and Caddy's logins are case-sensitive.
- name: OwnTracks user names are lower case
  ansible.builtin.assert:
    that: owntracks_users | map(attribute='name') | reject('match', '^[a-z0-9][a-z0-9_-]*$') | list | length == 0
    fail_msg: "owntracks_users names must be lower-case letters, digits, '-' and '_'"
    quiet: true
  when: owntracks_enabled | bool

# Caddy checks these on every location post, so a lower cost than above: the passwords are
# 24 random characters, which no cost factor needs to protect.
- name: OwnTracks app password hashes (bcrypt, for Caddy)
  ansible.builtin.shell:
    cmd: >-
      {{ ansible_playbook_python }} -c '{{ _hash_py }}' bcrypt 10 < '{{ obcell_secrets_dir }}/owntracks_{{ item.name }}_password'
      > '{{ obcell_secrets_dir }}/owntracks_{{ item.name }}.hash' && chmod 600 '{{ obcell_secrets_dir }}/owntracks_{{ item.name }}.hash'
    creates: "{{ obcell_secrets_dir }}/owntracks_{{ item.name }}.hash"
  # Only writes into secrets/ on the controller (like the password lookup), and the Caddyfile
  # needs the hash, so a --check preview of a new login works too.
  check_mode: false
  loop: "{{ owntracks_users if owntracks_enabled | bool else [] }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    _pw: "{{ lookup('ansible.builtin.password', obcell_secrets_dir ~ '/owntracks_' ~ item.name ~ '_password', chars=['ascii_letters', 'digits'], length=24) }}"
  when: _pw | length > 0

- name: Generated values are private
  ansible.builtin.shell: chmod 600 {{ obcell_secrets_dir }}/*
  changed_when: false
  check_mode: false
