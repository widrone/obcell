# Runs on the control machine: make sure secrets/<host>/ exists and every password has its hash.
- name: Secrets folder
  ansible.builtin.file:
    path: "{{ obcell_secrets_dir }}"
    state: directory
    mode: "0700"

- name: Hash helper
  ansible.builtin.set_fact:
    _hash_py: >-
      import sys; from passlib.hash import argon2, bcrypt; pw = sys.stdin.read().strip();
      print(argon2.using(type="ID", memory_cost=65536, time_cost=3, parallelism=4).hash(pw) if sys.argv[1] == "argon2"
      else bcrypt.using(rounds=14, ident="2a").hash(pw))

- name: Authelia password hashes (argon2id)
  ansible.builtin.shell:
    cmd: >-
      {{ ansible_playbook_python }} -c '{{ _hash_py }}' argon2 < '{{ obcell_secrets_dir }}/authelia_{{ item.name }}_password'
      > '{{ obcell_secrets_dir }}/authelia_{{ item.name }}.hash' && chmod 600 '{{ obcell_secrets_dir }}/authelia_{{ item.name }}.hash'
    creates: "{{ obcell_secrets_dir }}/authelia_{{ item.name }}.hash"
  loop: "{{ authelia_users }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    _pw: "{{ lookup('ansible.builtin.password', obcell_secrets_dir ~ '/authelia_' ~ item.name ~ '_password', chars=['ascii_letters', 'digits'], length=20) }}"
  # touching _pw first creates the password file
  register: _h
  when: _pw | length > 0

- name: Strom admin password hash (bcrypt)
  ansible.builtin.shell:
    cmd: >-
      {{ ansible_playbook_python }} -c '{{ _hash_py }}' bcrypt < '{{ obcell_secrets_dir }}/strom_admin_password'
      > '{{ obcell_secrets_dir }}/strom_admin_password_hash' && chmod 600 '{{ obcell_secrets_dir }}/strom_admin_password_hash'
    creates: "{{ obcell_secrets_dir }}/strom_admin_password_hash"
  when: strom_admin_password | length > 0

- name: Generated values are private
  ansible.builtin.shell: chmod 600 {{ obcell_secrets_dir }}/*
  changed_when: false
  check_mode: false
